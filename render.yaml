# Render Blueprint - Deploy TabRT04 Backend + PostgreSQL
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: tabungan-rt04-db
    plan: free
    databaseName: tabungan_rt04
    user: tabrt04_user
    region: singapore

services:
  - type: web
    name: tabrt04-backend
    plan: free
    region: singapore
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run migrate && npm run seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: tabungan-rt04-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: CORS_ORIGIN
        value: https://frontend-orcin-rho-30.vercel.app,https://frontend-rase135.vercel.app
      - key: LOG_LEVEL
        value: info
